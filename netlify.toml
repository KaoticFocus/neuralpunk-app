[build]
  command = "npm test"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server?path=/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/server?path=/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/message:send"
  to = "/.netlify/functions/server?path=/message:send"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/agent-card.json"
  to = "/.netlify/functions/server?path=/.well-known/agent-card.json"
  status = 200
  force = true